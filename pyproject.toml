[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alis-dwq"
version = "0.2.0"
description = "Layerwise DWQ + two-phase targets: distillation-tune hundreds-of-GB quantized MLX models on Apple Silicon without OOM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# mlx itself rides in with mlx-lm on macOS; on Linux (CI / CPU-only) install
# the CPU wheel explicitly: pip install "mlx[cpu]"
dependencies = ["mlx-lm>=0.31", "numpy", "tqdm"]

[project.urls]
Repository = "https://github.com/avlp12/alis-dwq"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["alis_dwq"]

[tool.setuptools.package-data]
alis_dwq = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "device: needs a real model on Apple Silicon (excluded in CI; no tests carry it yet)",
]
